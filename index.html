<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>ping me whenever</title>
    <link rel="icon" type="image/png" href="/pngs/1.png">
    <!-- Inline critical background style for instant rendering -->
    <style>
      body { background-color: #FEFF00; margin: 0; }
    </style>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* CSS for smooth animation */
      .indicator-dot {
        position: absolute;
        width: 8px;
        height: 8px;
        background-color: black;
        border-radius: 50%;
        right: -20px; 
        top: 0;
      }
    </style>
    <!-- SVG Definitions... -->
    <svg width="0" height="0" style="position: absolute; z-index: -1;">
      <defs>
        <clipPath id="squircle-clip" clipPathUnits="objectBoundingBox">
          <path d="M0.532 0C0.727 0 0.824 0.000007 0.893 0.050C0.915 0.066 0.934 0.085 0.950 0.107C1 0.176 1 0.273 1 0.468V0.532C1 0.727 1 0.824 0.950 0.893C0.934 0.915 0.915 0.934 0.893 0.950C0.824 1 0.727 1 0.532 1H0.468C0.273 1 0.176 1 0.107 0.950C0.085 0.934 0.066 0.915 0.050 0.893C0.000007 0.824 0 0.727 0 0.532V0.468C0 0.273 0.000007 0.176 0.050 0.107C0.066 0.085 0.085 0.066 0.107 0.050C0.176 0.000007 0.273 0 0.468 0H0.532Z" />
        </clipPath>
      </defs>
    </svg>
    <!-- Defer Motion script to prevent blocking render -->
    <script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js" defer></script>
  </head>
  <body>
    <div class="main-content-wrapper">
        <div class="title-block">
            <span class="main-title">Raffi<br/>Chilingaryan</span>
            <span class="date-range"></span>
        </div>
        <p class="description-block">
            I ship apps on the internet with friends. Tap an icon to learn more about a project. Also feel free to connect.
        </p>
    </div>

    <div class="sidebar-container">
        <div class="indicator-dot"></div>
        <a href="#" class="sidebar-icon" data-index="0"><img src="pngs/1.png" alt="Icon 1"></a>
        <div class="icon-separator"></div>
        <a href="#" class="sidebar-icon" data-index="1"><img src="pngs/2.png" alt="Icon 2"></a>
        <a href="#" class="sidebar-icon" data-index="2"><img src="pngs/3.png" alt="Icon 3"></a>
        <a href="#" class="sidebar-icon" data-index="3"><img src="pngs/4.png" alt="Icon 4"></a>
        <div class="icon-separator"></div>
        <a href="#" class="sidebar-icon" data-index="4"><img src="pngs/5.png" alt="Icon 5"></a>
        <div class="icon-separator"></div>
        <a href="#" class="sidebar-icon" data-index="5"><img src="pngs/6.png" alt="Icon 6"></a>
        <a href="#" class="sidebar-icon" data-index="6"><img src="pngs/7.png" alt="Icon 7"></a>
        <div class="icon-separator"></div>
        <a href="#" class="sidebar-icon" data-index="7"><img src="pngs/8.png" alt="Icon 8"></a>
    </div>

    <script>
      // --- Configurable Animation Parameters ---
      const CONTENT_FADE_DELAY = 400; // ms
      const SIDEBAR_FADE_DELAY = 400; // ms
      const CONTENT_FADE_DURATION = 1200; // ms
      const SIDEBAR_FADE_DURATION = 1200; // ms
      const FADE_EASING = 'ease-in-out'; // CSS easing function
      
      // --- Themes --- 
      const themes = [
        { name: 'facebook', bgColor: '#0062FF', textColor: '#FFFFFF' },
        { name: 'ramp', bgColor: '#DDFF00', textColor: '#353822' },
        { name: 'uniswap', bgColor: '#FF37C7', textColor: '#FFFFFF' },
        { name: 'mint', bgColor: '#98FF98', textColor: '#204620' },
        { name: 'bos', bgColor: '#B1AA8F', textColor: '#29230B' }
      ];
      
      // Function to convert hex to RGBA
      function hexToRGBA(hex, alpha) {
        hex = hex.replace('#', '');
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      
      // Function to apply a theme
      function applyTheme(theme) {
        let separatorAlpha = 0.35;
        const separatorColor = hexToRGBA(theme.textColor, separatorAlpha);
        
        // Set CSS Variables
        document.documentElement.style.setProperty('--bg-color', theme.bgColor);
        document.documentElement.style.setProperty('--text-color', theme.textColor);
        document.documentElement.style.setProperty('--separator-color', separatorColor);
        document.documentElement.style.setProperty('--content-fade-duration', `${CONTENT_FADE_DURATION / 1000}s`);
        document.documentElement.style.setProperty('--sidebar-fade-duration', `${SIDEBAR_FADE_DURATION / 1000}s`);
        document.documentElement.style.setProperty('--fade-easing', FADE_EASING);
        
        // --- DEBUGGING: Force dot color update --- 
        const dot = document.querySelector('.indicator-dot');
        if (dot) {
          dot.style.backgroundColor = theme.textColor;
          console.log(`DEBUG: Forcing dot color to ${theme.textColor}`);
        }
      }
      
      // --- Theme Application (RUNS IMMEDIATELY) ---
      const randomTheme = themes[Math.floor(Math.random() * themes.length)];
      applyTheme(randomTheme);
      console.log("Applied theme:", randomTheme.name);
      
      // --- Wait for DOM Ready for remaining logic ---
      document.addEventListener('DOMContentLoaded', () => {
          
          // Get the Motion library functions from the global object
          const { animate } = Motion;
          
          // Get DOM elements
          const sidebarIcons = document.querySelectorAll('.sidebar-icon');
          const indicatorDot = document.querySelector('.indicator-dot');
          const contentWrapper = document.querySelector('.main-content-wrapper');
          const titleBlock = contentWrapper?.querySelector('.title-block');
          const descriptionBlock = contentWrapper?.querySelector('.description-block');
          
          let currentActiveIcon = null; // Keep track of the active icon

          // --- Function Definitions ---
          
          function setActiveIcon(targetIcon) {
              // Remove active class from previously active icon
              if (currentActiveIcon) {
                  currentActiveIcon.classList.remove('active');
              }
              // Add active class to the new target icon
              if (targetIcon) {
                  targetIcon.classList.add('active');
                  currentActiveIcon = targetIcon;
              }
          }
          
          function moveIndicator(targetIcon) {
              if (!targetIcon || !indicatorDot || window.innerWidth <= 768) return; // Added mobile check
              // Calculate center position relative to the sidebar container
              const targetTop = targetIcon.offsetTop;
              const targetHeight = targetIcon.offsetHeight;
              const dotHeight = indicatorDot.offsetHeight;
              const newDotTop = targetTop + (targetHeight / 2) - (dotHeight / 2);

              console.log("Moving indicator with spring animation");
              
              // Use the spring animation exactly as shown in the docs
              animate(
                  indicatorDot,
                  { top: `${newDotTop}px` },
                  { 
                      type: "spring", 
                      stiffness: 380,
                      damping: 28,
                      mass: 1
                  }
              );
          }
          
          function updateContent(index) {
              if (index < 0 || index >= projectData.length || !contentWrapper || !titleBlock || !descriptionBlock) {
                  console.error("Invalid index or elements not found for content update.");
                  return;
              }

              const data = projectData[index];
              const mainTitleSpan = titleBlock.querySelector('.main-title');
              const dateRangeSpan = titleBlock.querySelector('.date-range');

              // Update Title - Adjust for mobile
              if (mainTitleSpan) {
                 if (window.innerWidth <= 768) {
                     // On mobile, replace <br/> with a space
                     mainTitleSpan.innerHTML = data.title.replace(/<br\s*\/?>/gi, ' ');
                 } else {
                     // On desktop, use the original title with <br/>
                     mainTitleSpan.innerHTML = data.title; 
                 }
              }

              // Update Description - Use innerHTML to render links
              descriptionBlock.innerHTML = data.description;

              // Handle Date Range within Title Block
              if (dateRangeSpan) {
                  if (data.dateRange) {
                      dateRangeSpan.textContent = data.dateRange;
                      dateRangeSpan.style.visibility = 'visible';
                  } else {
                      dateRangeSpan.textContent = ' '; // Keep space for layout
                      dateRangeSpan.style.visibility = 'hidden';
                  }
              }
          }
          
          // --- Event Listeners & Initial Setup ---
          
          // Add click listeners
          sidebarIcons.forEach(icon => {
              icon.addEventListener('click', (event) => {
                  event.preventDefault(); 
                  handleIconSelection(icon);
              });
          });

          // Add Keyboard Navigation Listener
          document.addEventListener('keydown', (event) => {
              // Check for any of the four arrow keys
              if (['ArrowDown', 'ArrowUp', 'ArrowRight', 'ArrowLeft'].includes(event.key)) {
                  event.preventDefault(); // Prevent default page scrolling
                  
                  if (!currentActiveIcon) return; // Do nothing if no icon is active
                  
                  const currentIndex = parseInt(currentActiveIcon.dataset.index, 10);
                  let nextIndex;
                  const numIcons = sidebarIcons.length;

                  // Right and Down increment, Left and Up decrement
                  if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
                      nextIndex = (currentIndex + 1) % numIcons; // Wrap around to the start
                  } else { // ArrowUp or ArrowLeft
                      nextIndex = (currentIndex - 1 + numIcons) % numIcons; // Wrap around to the end
                  }

                  const nextIcon = document.querySelector(`.sidebar-icon[data-index="${nextIndex}"]`);
                  if (nextIcon) {
                      handleIconSelection(nextIcon);
                  }
              }
          });

          // Helper function to handle selecting an icon (click or key)
          function handleIconSelection(icon) {
              moveIndicator(icon); 
              setActiveIcon(icon); 
              const index = parseInt(icon.dataset.index, 10); 
              if (!isNaN(index)) {
                  updateContent(index); 
              }
          }
          
          function setInitialState() {
              if (sidebarIcons.length > 0) {
                  const firstIcon = sidebarIcons[0];
                  // Use the helper function for initial state
                  handleIconSelection(firstIcon); 
              }
          }
          
          // Add function to dynamically align content with first separator
          function alignContentWithSeparator() {
              // Only run alignment logic on desktop
              if (window.innerWidth > 768) {
                  const firstSeparator = document.querySelector('.icon-separator');
                  const content = document.querySelector('.main-content-wrapper');
                  
                  if (!firstSeparator) {
                      console.error("DEBUG: First separator not found!");
                      return;
                  }
                  if (!content) {
                      console.error("DEBUG: Content wrapper not found!");
                      return;
                  }
                  
                  const firstSeparatorRect = firstSeparator.getBoundingClientRect();
                  console.log("DEBUG: First Separator Rect:", firstSeparatorRect);
                  
                  const newTop = firstSeparatorRect.top;
                  content.style.top = `${newTop}px`;
                  console.log(`DEBUG: Setting content top to: ${newTop}px`);
              } else {
                  // On mobile, ensure top style is removed or set to auto
                  const content = document.querySelector('.main-content-wrapper');
                  if(content) content.style.top = 'auto'; 
              }
          }
          
          // Initial setup 
          requestAnimationFrame(() => {
              const initialSetupDelay = 200;
              setTimeout(() => {
                  setInitialState(); 
                  alignContentWithSeparator(); 

                  setTimeout(() => {
                      const content = document.querySelector('.main-content-wrapper');
                      if (content) {
                          content.style.opacity = '1';
                          console.log("Content faded in");
                      }
                  }, CONTENT_FADE_DELAY - initialSetupDelay); 

                  setTimeout(() => {
                      const sidebar = document.querySelector('.sidebar-container');
                      if (sidebar) {
                          sidebar.style.opacity = '1';
                          console.log("Sidebar faded in");
                      }
                  }, SIDEBAR_FADE_DELAY - initialSetupDelay); 
              }, initialSetupDelay); 
          });

          // Re-align on window resize
          window.addEventListener('resize', () => {
              setInitialState(); // This calls updateContent which handles mobile/desktop title
              alignContentWithSeparator(); // Handles mobile/desktop alignment
              
              // Ensure elements are visible and correctly transformed after resize
              const content = document.querySelector('.main-content-wrapper');
              const sidebar = document.querySelector('.sidebar-container');
              
              if (content) {
                  content.style.opacity = '1'; // Make sure it's visible
                  if (window.innerWidth > 768) {
                       content.style.transform = 'translate(-50%, 0)'; // Desktop transform
                  } else {
                      content.style.transform = 'none'; // Mobile transform
                  }
              }
              if (sidebar) {
                  sidebar.style.opacity = '1'; // Make sure it's visible
                  // Sidebar transform is handled by CSS only (desktop vs mobile)
              }
          });
          
          // --- Project Data ---
          const projectData = [
            {
              title: "Raffi<br/>Chilingaryan",
              dateRange: "",
              description: "<p>I build apps (mostly iOS) with friends and curate <a href='https://www.x.com/spottedinprod'>Spotted in Prod.</a> You can use your arrow keys to get around here.</p><p>Feel free to <a href='mailto:raffichilingaryan@gmail.com'>get in touch.</a></p>"
            },
            {
              title: "Steddy",
              dateRange: "Jul 2021 - Dec 2023",
              description: "<p>My first <a href='https://apps.apple.com/us/app/steddy-stay-consistent/id1579825538?platform=iphone'>app</a> was a weekly routine planner.</p><p>v1 dev by <a href='https://x.com/ChristophPader'>Christoph.</a> <p>v2 dev by <a href='https://x.com/reactiive_'>Enzo.</a></p><p>App icon by <a href='https://www.michaelflarup.com'>Michael.</a></p>"
            },
            {
              title: "Empty",
              dateRange: "Jan 2024 - Present",
              description: "<p>A fasting <a href='https://apps.apple.com/us/app/empty-fasting/id6475213946'>tracker</a> motivated by my personal goal to snack less before bed.</p><p>Dev by <a href='https://x.com/rarfell'>Rafael.</a></p><p>Icons & illustrations by <a href='https://hannahlee.ca/'>Hannah.</a></p>"
            },
            {
              title: "Numbies",
              dateRange: "Apr 2024 - Aug 2024",
              description: "<p>A social fitness <a href='https://apps.apple.com/us/app/numbies-work-out-with-friends/id6448198083'>experiment</a> that allows you to send a notification blast to your friends and exercise live together in real time.</p><p>Dev by <a href='https://x.com/antfroze'>Anthony</a> and <a href='https://x.com/ViperScripts'>Caleb.</a></p>"
            },
            {
              title: "Shop",
              dateRange: "Nov 2024 - Mar 2025",
              description: "<p>I worked briefly as a designer on Shop Minis - a <a href='https://shop.app/minis/'>platform</a> for third party developers to create unique shopping experiences on top of the Shop mobile app.</p>"
            },
            {
              title: "Shift",
              dateRange: "Mar 2025 - Present",
              description: "<p>An alarm app that helps you get up earlier by shifting your wake up time by small increments.</p><p>If you're on the Apple Developer Support team, please grant me Critical Alerts entitlements so I can launch this.</p>"
            },
            {
              title: "******",
              dateRange: "*** **** * ******",
              description: "*****************************************************************************************************************"
            },
            {
              title: "SIP",
              dateRange: "Jul 2024 - Present",
              description: "<p><a href='https://www.x.com/spottedinprod'>Spotted in Prod</a> (SIP for short) is a curation of my favorite moments across iOS apps that I've tried.</p>"
            }
          ];
      });
    </script>
  </body>
</html>
