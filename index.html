<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raffi Chilingaryan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg class="triangle-visualization-svg">
        <!-- Triangle polygons will be added by JS -->
    </svg>
    <div class="region-borders-container">
      <!-- Border divs will be added/managed by JS -->
    </div>
    <div class="name-container">
      <span>R</span><span>A</span><span>F</span><span>F</span><span>I</span>
      <span class="space"> </span>
      <span>C</span><span>H</span><span>I</span><span>L</span><span>I</span><span>N</span><span>G</span><span>A</span><span>R</span><span>Y</span><span>A</span><span>N</span>
    </div>

    <script>
      const nameContainer = document.querySelector('.name-container');
      const letters = Array.from(nameContainer.children); // Get all spans (letters + space)
      const numLetters = letters.length;
      let letterRegions = []; // Stores { start: x, end: x } boundaries along top/bottom edge
      let letterCenters = []; // Stores horizontal center { x: x } for each letter span
      let activeLetterIndex = -1; // Track the index of the letter whose triangles contain the mouse
      let previousMouseX = null; // Needed only if we revert to range checking
      const svgContainer = document.querySelector('.triangle-visualization-svg'); // Get SVG container

      // --- Colors for Visualization (Sampled from image) ---
      // RAFFI CHILINGARYAN
      const regionColors = [
        '#FF8080', // R (Light Red)
        '#FFFF80', // A (Light Yellow)
        '#80FF80', // F (Light Green)
        '#80FFFF', // F (Light Cyan)
        '#8080FF', // I (Light Blue)
        '#FF80FF', // Space (Light Magenta)
        '#FF0000', // C (Red)
        '#0000FF', // H (Blue)
        '#FF00FF', // I (Magenta)
        '#808080', // L (Gray)
        '#00FF00', // I (Green)
        '#008080', // N (Teal)
        '#FFFF00', // G (Yellow)
        '#FF8080', // A (Light Red) - Repeat or choose new?
        '#FFFF80', // R (Light Yellow)
        '#80FF80', // Y (Light Green)
        '#80FFFF', // A (Light Cyan)
        '#8080FF'  // N (Light Blue)
      ];

      // --- Helper: Calculate Sign for Point-in-Triangle --- 
      function sign(p1, p2, p3) {
          return (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
      }

      // --- Helper: Check if point is in triangle --- 
      function pointInTriangle(pt, v1, v2, v3) {
          const d1 = sign(pt, v1, v2);
          const d2 = sign(pt, v2, v3);
          const d3 = sign(pt, v3, v1);
          const has_neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
          const has_pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
          // Point is inside or on the edge if signs are all non-negative or all non-positive
          return !(has_neg && has_pos);
      }

      // --- Calculate Horizontal Letter Positions & Widths --- 
      function calculateLetterCenters() {
          letterCenters = [];
          letters.forEach(span => {
              const rect = span.getBoundingClientRect();
              letterCenters.push({
                  x: rect.left + rect.width / 2,
                  width: rect.width,
                  left: rect.left, 
                  right: rect.right
              });
          });
           // console.log("Letter Centers:", letterCenters);
      }

      // --- Calculate trigger regions (beam bases) & Draw SVG Shapes (Truly Fixed Outer Slant) ---
      function calculateRegions() {
        const viewportWidth = window.innerWidth;
        const viewportCenterX = viewportWidth / 2;
        letterRegions = new Array(numLetters); // Initialize array

        // 1. Ensure letter positions & widths are calculated first
        calculateLetterCenters();
        if (letterCenters.length === 0) return; // Need centers

        // 2. Define Outer Regions FIRST (Fixed Shape - 35% base)
        const outerBaseWidth = viewportWidth * 0.35;
        if (numLetters > 0) {
            letterRegions[0] = { start: 0, end: outerBaseWidth };
            letterRegions[numLetters - 1] = { start: viewportWidth - outerBaseWidth, end: viewportWidth };
        }

        // 3. Calculate Target Base Width for MIDDLE letters ONLY
        const middleStartIndex = 1;
        const middleEndIndex = numLetters - 2;
        const middleRegionCount = Math.max(0, middleEndIndex - middleStartIndex + 1);
        const minBaseWidth = 10; // Min width for centermost letters (px)
        const middleAvailableWidth = (numLetters > 1) ? Math.max(0, letterRegions[numLetters - 1].start - letterRegions[0].end) : 0;
        const easeInQuad = t => t*t;
        const middleTargetBaseWidths = [];

        if (middleRegionCount > 0 && middleAvailableWidth > 0) {
            // Estimate max base width possible in the middle if all were widest
            const theoreticalMiddleMaxWidth = middleAvailableWidth / middleRegionCount; 

            for (let i = middleStartIndex; i <= middleEndIndex; i++) {
                if (!letterCenters[i]) { middleTargetBaseWidths.push(minBaseWidth); continue; }
                const distanceFromCenter = Math.abs(letterCenters[i].x - viewportCenterX);
                // Normalize distance relative to the middle section's half-width
                const middleMaxDistance = middleAvailableWidth / 2; 
                const normalizedDistance = middleMaxDistance > 0 ? Math.min(1, distanceFromCenter / middleMaxDistance) : 0.5; 
                const easedNormalizedDistance = easeInQuad(normalizedDistance);
                // Interpolate between min and a *reasonable* max for middle sections
                const targetWidth = minBaseWidth + (theoreticalMiddleMaxWidth - minBaseWidth) * easedNormalizedDistance;
                middleTargetBaseWidths.push(targetWidth);
            }

            // 4. Scale MIDDLE widths to fit available space and define regions
            const totalMiddleTargetWidth = middleTargetBaseWidths.reduce((sum, w) => sum + w, 0);
            const scaleFactor = totalMiddleTargetWidth > 0 ? middleAvailableWidth / totalMiddleTargetWidth : 0;
            
            let currentX = letterRegions[0].end; // Start after the first fixed region
            for (let i = 0; i < middleRegionCount; i++) {
                const actualBaseWidth = middleTargetBaseWidths[i] * scaleFactor;
                const regionStart = currentX;
                const regionEnd = currentX + actualBaseWidth;
                letterRegions[middleStartIndex + i] = { start: regionStart, end: regionEnd };
                currentX = regionEnd;
            }
            // Ensure the last middle region perfectly meets the start of the last outer region
             if (middleRegionCount > 0 && letterRegions[numLetters-1]) {
                 letterRegions[middleEndIndex].end = letterRegions[numLetters - 1].start;
            }
        } else if (middleRegionCount === 0 && numLetters === 2) {
             // Handle edge case of only 2 letters (both outer)
             letterRegions[0].end = letterRegions[1].start; 
        }
       
        // console.log("Final Letter Regions (Truly Fixed Outer):", letterRegions);

        // 5. Draw SVG polygons (No overrides needed now, regions are correct)
        svgContainer.innerHTML = ''; // Clear existing polygons
        const viewportHeight = window.innerHeight;
        const nameCenterY = viewportHeight / 2; 

        letterRegions.forEach((region, index) => {
          if (!region || typeof region.start !== 'number' || typeof region.end !== 'number') return;
          if (!letterCenters[index] || typeof letterCenters[index].left !== 'number') return;
          // Allow zero-width regions only if they result from calculations (e.g. middle space = 0)
          // if (region.start >= region.end) return; 
          
          const color = regionColors[index % regionColors.length]; 
          const letterLeft = letterCenters[index].left;
          const letterRight = letterCenters[index].right;

          // Vertices for polygons
          const vTopLeft = { x: region.start, y: 0 };
          const vTopRight = { x: region.end, y: 0 };
          const vCenterLeft = { x: letterLeft, y: nameCenterY }; 
          const vCenterRight = { x: letterRight, y: nameCenterY }; 
          const vBottomLeft = { x: region.start, y: viewportHeight };
          const vBottomRight = { x: region.end, y: viewportHeight };
          
          // Clamp center points slightly
          const safeCenterLeftX = Math.min(vCenterLeft.x, vCenterRight.x - 0.1); 
          const safeCenterRightX = Math.max(vCenterRight.x, vCenterLeft.x + 0.1);
          vCenterLeft.x = safeCenterLeftX;
          vCenterRight.x = safeCenterRightX;

          const topPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          topPoly.setAttribute('points', `${vTopLeft.x},${vTopLeft.y} ${vTopRight.x},${vTopRight.y} ${vCenterRight.x},${vCenterRight.y} ${vCenterLeft.x},${vCenterLeft.y}`);
          topPoly.setAttribute('fill', color);
          svgContainer.appendChild(topPoly);
          const bottomPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          bottomPoly.setAttribute('points', `${vBottomLeft.x},${vBottomLeft.y} ${vBottomRight.x},${vBottomRight.y} ${vCenterRight.x},${vCenterRight.y} ${vCenterLeft.x},${vCenterLeft.y}`);
          bottomPoly.setAttribute('fill', color);
          svgContainer.appendChild(bottomPoly);
        });
      }

      // --- Handle mouse movement (Adjusted for Fixed Outer Shape Slant) ---
      function handleMouseMove(event) {
        const currentMouseX = event.clientX;
        const mouseY = event.clientY;
        const viewportHeight = window.innerHeight;
        const nameCenterY = viewportHeight / 2;

        // Initialize previousMouseX if it's the first event
        if (previousMouseX === null) {
          previousMouseX = currentMouseX;
        }

        const minX = Math.min(previousMouseX, currentMouseX);
        const maxX = Math.max(previousMouseX, currentMouseX);

        // Determine the vertical position factor (0 at center, 1 at edges)
        const verticalFactor = Math.abs(mouseY - nameCenterY) / (viewportHeight / 2);

        // Find which letter's region the mouse interacts with
        for (let i = 0; i < numLetters; i++) {
          if (!letterCenters[i] || typeof letterCenters[i].left !== 'number' || !letterRegions[i]) continue;

          const region = letterRegions[i]; // Base boundaries for calculation
          const letterLeft = letterCenters[i].left;
          const letterRight = letterCenters[i].right;
          const letterCenterX = letterCenters[i].x; 
          const centerWidth = letterRight - letterLeft; 
          const letterSpan = letters[i];

          // Determine the EFFECTIVE base start/end/width for interpolation, overriding for first/last
          let effectiveBaseStartX = region.start;
          let effectiveBaseEndX = region.end;
          if (i === 0) {
              effectiveBaseStartX = 0;
          } else if (i === numLetters - 1) {
              effectiveBaseEndX = viewportWidth; 
          }
          const effectiveBaseWidth = effectiveBaseEndX - effectiveBaseStartX;
          const effectiveBaseCenterX = effectiveBaseStartX + effectiveBaseWidth / 2;

          // Check 1: Does the horizontal mouse movement range overlap the EFFECTIVE base?
          const horizontalOverlap = !(effectiveBaseEndX <= minX || effectiveBaseStartX >= maxX);

          if (horizontalOverlap) {
            // Calculate the expected width of the shape at the current mouseY
            // Interpolate between centerWidth and the EFFECTIVE baseWidth
            const widthAtY = centerWidth + (effectiveBaseWidth - centerWidth) * verticalFactor;
            const halfWidthAtY = widthAtY / 2;

            // Calculate the shape's *center* position at the current mouseY
            // Interpolate between letterCenterX and the EFFECTIVE baseCenterX
            const centerAtY = letterCenterX + (effectiveBaseCenterX - letterCenterX) * verticalFactor;
            
            const shapeStartX = centerAtY - halfWidthAtY;
            const shapeEndX = centerAtY + halfWidthAtY;

            // Check 2: Is the *current* mouseX within the shape's boundaries at this mouseY?
            const withinShapeVertically = (currentMouseX >= shapeStartX && currentMouseX < shapeEndX);

            // If both checks pass and not already animating, trigger
            if (withinShapeVertically && !letterSpan.classList.contains('animate-letter')) {
              letterSpan.classList.add('animate-letter');
              letterSpan.addEventListener('animationend', () => {
                letterSpan.classList.remove('animate-letter');
              }, { once: true });
            }
          }
        }

        // Update previous mouse position for the next event
        previousMouseX = currentMouseX;
      }

      // --- Initial setup and event listeners ---
      requestAnimationFrame(() => {
         // calculateLetterCenters(); // Called within calculateRegions now
         calculateRegions();      // Calculates centers, regions & draws SVG
      }); 
      window.addEventListener('mousemove', handleMouseMove);
      window.addEventListener('resize', calculateRegions); // Recalculate on resize
    </script>
  </body>
</html>
