    <script>
      // Get the Motion library functions from the global object
      const { animate } = Motion;
      
      // Minimal JavaScript - Can add back functionality later if needed
      
      // Example: Get references (might not be needed right now)
      const nameContainer = document.querySelector('.name-container');
      const letters = Array.from(nameContainer?.children || []);
      const sidebarContainer = document.querySelector('.sidebar-container');

      function calculateLetterCenters() {
          // Placeholder - can be removed if no JS interaction needed
          // console.log('Calculating letter centers - if needed');
      }

      function calculateRegions() {
         // Placeholder - can be removed if no JS interaction needed
         // console.log('Calculating regions - if needed');
         calculateLetterCenters();
      }

      // --- Navigation Indicator Logic ---
      const sidebarIcons = document.querySelectorAll('.sidebar-icon');
      const indicatorDot = document.querySelector('.indicator-dot');
      const contentWrapper = document.querySelector('.main-content-wrapper');
      const titleBlock = contentWrapper?.querySelector('.title-block');
      const descriptionBlock = contentWrapper?.querySelector('.description-block');

      function moveIndicator(targetIcon) {
          if (!targetIcon || !indicatorDot) return;

          // Calculate center position relative to the sidebar container
          const targetTop = targetIcon.offsetTop;
          const targetHeight = targetIcon.offsetHeight;
          const dotHeight = indicatorDot.offsetHeight;
          const newDotTop = targetTop + (targetHeight / 2) - (dotHeight / 2);

          console.log("Moving indicator with spring animation");
          
          // Use the spring animation exactly as shown in the docs
          animate(
              indicatorDot,
              { top: `${newDotTop}px` },
              { 
                  type: "spring", 
                  stiffness: 380,
                  damping: 28,
                  mass: 1
              }
          );
      }

      // --- NEW: Update Content Function ---
      function updateContent(index) {
          if (index < 0 || index >= projectData.length || !contentWrapper || !titleBlock || !descriptionBlock) {
              console.error("Invalid index or elements not found for content update.");
              return;
          }

          const data = projectData[index];
          const mainTitleSpan = titleBlock.querySelector('.main-title');
          const dateRangeSpan = titleBlock.querySelector('.date-range');

          // Update Title
          if (mainTitleSpan) {
             mainTitleSpan.innerHTML = data.title;
          }

          // Update Description
          descriptionBlock.textContent = data.description;

          // Handle Date Range within Title Block
          if (dateRangeSpan) {
              if (data.dateRange) {
                  dateRangeSpan.textContent = data.dateRange;
                  dateRangeSpan.style.visibility = 'visible';
              } else {
                  dateRangeSpan.textContent = ' '; // Keep space for layout
                  dateRangeSpan.style.visibility = 'hidden';
              }
          }
      }

      // Set initial position and content
      function setInitialState() {
        if (sidebarIcons.length > 0) {
            moveIndicator(sidebarIcons[0]); 
            updateContent(0); // Load home content
        }
      }

      // Add click listeners
      sidebarIcons.forEach(icon => {
        icon.addEventListener('click', (event) => {
            event.preventDefault(); 
            moveIndicator(icon); 
            const index = parseInt(icon.dataset.index, 10); // Get index from data attribute
            if (!isNaN(index)) {
                updateContent(index); // Update content based on clicked index
            }
        });
      });
      // --- End Navigation --- 

      // Initial setup 
      requestAnimationFrame(() => {
         // calculateRegions(); // No longer needed for static layout
         setInitialState(); // Set dot position and initial content
      }); 
      window.addEventListener('resize', () => {
          // calculateRegions(); // No longer needed for static layout
          // We might need to recalculate dot position if icon spacing changes
          setInitialState(); // Reset dot and content (or just dot if content should persist)
      });

      let queueIntervalId = null; // ID for the interval timer
      let nameCenterY = window.innerHeight / 2; // Global variable for name's vertical center

      // --- Project Data ---
      const projectData = [
        { // 0: Home (Index 0, Icon 1)
          title: "Raffi<br/>Chilingaryan",

        },
        { // 1: Steddy (Index 1, Icon 2)

        },
